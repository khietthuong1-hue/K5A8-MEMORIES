<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng Nhập - K5A8 MEMORIES</title>
    <link rel="icon" href="Images/logo.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #00BFFF;
            --text-main: #01579B;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.8);
            --shadow: 0 15px 35px rgba(135, 206, 235, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-main);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CLOUDS ANIMATION --- */
        .cloud-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .cloud { position: absolute; background: #fff; border-radius: 100px; opacity: 0.8; filter: blur(5px); animation: floatCloud linear infinite; }
        .cloud::after, .cloud::before { content: ''; position: absolute; background: inherit; border-radius: 50%; }
        .cloud::after { width: 40%; height: 100%; top: -60%; left: 30%; }
        .cloud::before { width: 30%; height: 80%; top: -40%; left: 60%; }
        .c1 { width: 120px; height: 40px; top: 10%; left: -50px; animation-duration: 25s; }
        .c2 { width: 180px; height: 60px; top: 30%; left: -200px; animation-duration: 35s; animation-delay: 5s; opacity: 0.6; }
        .c3 { width: 100px; height: 35px; top: 70%; left: -100px; animation-duration: 20s; animation-delay: 2s; }
        @keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(120vw); } }

        /* --- LOGIN CARD (GLASSMORPHISM) --- */
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 10;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #fff;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary-color);
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0, 191, 255, 0.2);
            border: 4px solid #E0F7FA;
        }

        h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 35px;
        }

        /* --- LOGIN BUTTON --- */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            background: #fff;
            color: #333;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-google img {
            width: 24px;
            height: 24px;
        }

        .btn-google:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .btn-google:active {
            transform: translateY(0);
        }

        /* --- BACK LINK --- */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        /* --- LOADER --- */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(5px);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .loader-overlay.active { opacity: 1; visibility: visible; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(0, 191, 255, 0.2);
            border-top-color: var(--primary-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="cloud-container">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
    </div>

    <div class="loader-overlay" id="loading-screen">
        <div class="spinner"></div>
        <h3 style="font-family: 'Baloo 2'; color: var(--primary-color);">Đang đưa bạn về nhà...</h3>
    </div>

    <div class="login-wrapper">
        <div class="glass-card">
            <div class="logo-icon">
                <i class="fas fa-cloud"></i>
            </div>
            <h1>K5A8 MEMORIES</h1>
            <p class="subtitle">Đăng nhập để lưu giữ thanh xuân</p>

            <button class="btn-google" id="btn-login-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
                Đăng nhập bằng Google
            </button>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Trở về Trang chủ</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyBKUkvFuSBZcCQlVnuey56u7UukG1wM3Ig",
            authDomain: "k5a8-fe4d3.firebaseapp.com",
            databaseURL: "https://k5a8-fe4d3-default-rtdb.firebaseio.com",
            projectId: "k5a8-fe4d3",
            storageBucket: "k5a8-fe4d3.firebasestorage.app",
            messagingSenderId: "488022889850",
            appId: "1:488022889850:web:3aaca9ec88f339fce0f2c3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const btnLogin = document.getElementById('btn-login-google');
        const loadingScreen = document.getElementById('loading-screen');

        // Kiểm tra xem người dùng đã đăng nhập chưa
        // Nếu đã đăng nhập rồi mà lỡ bấm nhầm vào trang dangnhap.html, tự động đá về index.html
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadingScreen.classList.add('active');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            }
        });

        // Xử lý sự kiện bấm nút Đăng nhập
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // Thành công -> Bật màn hình chờ rồi chuyển trang
                    loadingScreen.classList.add('active');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                })
                .catch((error) => {
                    console.error("Lỗi đăng nhập:", error);
                    alert("Đăng nhập thất bại: " + error.message);
                });
        });
    </script>
    <script type="module" src="auth-guard.js"></script>
</body>
</html>
