<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#87CEEB">
    <link rel="apple-touch-icon" href="Images/logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #00BFFF;
            --text-main: #01579B;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.9);
            --safe-area-top: env(safe-area-inset-top);
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
            color: var(--text-main); margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh;
        }

        /* --- CLOUDS --- */
        .cloud-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .cloud { position: absolute; background: #fff; border-radius: 100px; opacity: 0.8; filter: blur(5px); animation: floatCloud linear infinite; }
        .c1 { width: 150px; height: 50px; top: 15%; left: -150px; animation-duration: 25s; }
        .c2 { width: 200px; height: 70px; top: 40%; left: -200px; animation-duration: 35s; animation-delay: 5s; opacity: 0.6; }
        @keyframes floatCloud { 0% { transform: translateX(0); } 100% { transform: translateX(120vw); } }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.5); padding: 15px 20px; padding-top: max(15px, var(--safe-area-top));
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(135, 206, 235, 0.2);
        }
        .nav-logo { font-family: 'Baloo 2', cursive; font-size: 26px; font-weight: 800; color: var(--primary-color); text-shadow: 2px 2px 0px #fff; display: flex; align-items: center; gap: 5px; cursor: pointer;}
        .menu-toggle { font-size: 26px; color: var(--primary-color); cursor: pointer; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px rgba(135, 206, 235, 0.3); transition: 0.3s; }
        .menu-toggle:active { transform: scale(0.9); }

        .nav-links {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; flex-direction: column; padding-top: 100px; gap: 10px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 999; box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }
        .nav-links.active { right: 0; }
        .nav-links a { padding: 15px 25px; margin: 0 15px; border-radius: 15px; font-size: 16px; font-weight: 700; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .nav-links a:hover { background: #E1F5FE; color: var(--primary-color); transform: translateX(5px); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.5); z-index: 998; opacity: 0; visibility: hidden; transition: 0.5s; backdrop-filter: blur(3px); }
        .overlay.active { opacity: 1; visibility: visible; }

        /* --- MEMBER GRID & TOOLS --- */
        .container { max-width: 1200px; margin: 100px auto 40px; padding: 20px; }
        
        .intro-box { text-align: center; background: rgba(255,255,255,0.6); padding: 30px; border-radius: 20px; margin-bottom: 30px; border: 2px solid #fff; }
        .intro-box h2 { font-family: 'Baloo 2'; font-size: 32px; color: var(--primary-color); margin-bottom: 10px; line-height: 1.2;}

        /* Toolbar: Search & Filter */
        .toolbar { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; align-items: center; }
        .search-box { position: relative; width: 100%; max-width: 500px; }
        .search-box input { width: 100%; padding: 15px 20px 15px 45px; border-radius: 30px; border: 2px solid #fff; background: rgba(255,255,255,0.8); font-family: 'Quicksand'; font-size: 16px; outline: none; box-shadow: 0 5px 15px rgba(135,206,235,0.2); transition: 0.3s; box-sizing: border-box;}
        .search-box input:focus { border-color: var(--primary-color); background: #fff; }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-color); font-size: 18px; }

        .filter-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .chip { padding: 8px 18px; border-radius: 20px; border: 2px solid #fff; background: rgba(255,255,255,0.5); color: var(--text-main); font-family: 'Quicksand'; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 14px;}
        .chip:hover, .chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); box-shadow: 0 4px 10px rgba(0, 191, 255, 0.3); }

        /* Grid */
        .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; margin-top: 50px; }

        /* Card */
        .article-card {
            background: var(--glass-bg); backdrop-filter: blur(15px); border: 2px solid #fff; border-radius: 20px;
            overflow: visible; position: relative; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center;
            padding-bottom: 20px;
        }
        .article-card:hover { transform: translateY(-8px); background: #fff; box-shadow: 0 15px 30px rgba(135, 206, 235, 0.4); border-color: var(--primary-color); }
        
        .article-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-top: -40px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: #fff; }
        .article-card:hover img { transform: scale(1.1) translateY(-5px); border-color: #E1F5FE; }

        .article-card-content { padding: 15px 20px 0; width: 100%; box-sizing: border-box; }
        .article-card h3 { font-family: 'Baloo 2'; color: var(--text-main); font-size: 20px; margin: 0 0 5px 0; }
        .article-card p { font-size: 14px; color: #555; margin: 0; font-weight: 500; }
        .tag-role { display: inline-block; background: #E1F5FE; color: var(--primary-color); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-top: 10px; text-transform: uppercase;}

        /* Message when no results */
        .no-results { text-align: center; grid-column: 1 / -1; padding: 40px; font-weight: 700; color: #666; font-size: 18px; display: none; }

        /* --- PROFILE MODAL --- */
        .modal-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(5px); }
        .modal-container.active { opacity: 1; visibility: visible; }
        
        .profile-box { background: #fff; width: 90%; max-width: 450px; border-radius: 25px; position: relative; padding: 40px 30px 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.2); transform: scale(0.8) translateY(30px); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-container.active .profile-box { transform: scale(1) translateY(0); }

        .close-profile { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #999; transition: 0.3s; }
        .close-profile:hover { color: #ff4757; transform: rotate(90deg); }

        .pro-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 5px solid var(--primary-color); box-shadow: 0 10px 20px rgba(0,191,255,0.3); margin-top: -80px; margin-bottom: 15px; background: #fff; }
        .pro-name { font-family: 'Baloo 2'; font-size: 28px; color: var(--text-main); margin: 0 0 5px 0; line-height: 1.2; }
        .pro-role { color: var(--primary-color); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        .pro-quote { margin: 20px 0; font-style: italic; color: #555; background: #F0F8FF; padding: 15px; border-radius: 15px; font-size: 15px; position: relative;}
        .pro-quote::before { content: '"'; font-family: serif; font-size: 40px; color: rgba(0,191,255,0.2); position: absolute; top: -10px; left: 10px; line-height: 1;}
        
        .pro-socials { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .soc-icon { width: 40px; height: 40px; border-radius: 50%; background: #F0F4F8; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 18px; transition: 0.3s; text-decoration: none; }
        .soc-icon:hover { background: var(--primary-color); color: #fff; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,191,255,0.3); }

        footer { text-align: center; padding: 30px; font-size: 14px; color: var(--text-main); font-weight: 600; }
    </style>
</head>

            { id: 28, name: "Trần Vĩnh An", role: "Bình an, vui vẻ", img: "Avatar/ava13.jpg", cat: "thanhvien", quote: "Một đời bình an, một kiếp vui vẻ." },
            { id: 29, name: "Mai Như Ý", role: "Thành viên K5A8", img: "Avatar/ava28.jpg", cat: "thanhvien", quote: "Luôn tự hào là một mảnh ghép của lớp chúng mình." },
            { id: 30, name: "Nguyễn Thanh Mai", role: "Thành viên K5A8", img: "Avatar/ava8.jpg", cat: "thanhvien", quote: "Kỷ niệm tuổi học trò là vô giá." }
        ];

        const gridContainer = document.getElementById('members-grid');
        const noResultsMsg = document.getElementById('no-results');
        let currentFilter = 'all';

        // Khởi tạo hiển thị tất cả thành viên
        function renderMembers(dataToRender) {
            gridContainer.innerHTML = '';
            if (dataToRender.length === 0) {
                noResultsMsg.style.display = 'block';
            } else {
                noResultsMsg.style.display = 'none';
                dataToRender.forEach(member => {
                    const card = document.createElement('div');
                    card.className = `article-card`;
                    // Nhấn vào thẻ mở profile modal
                    card.onclick = () => openProfile(member.id);
                    
                    card.innerHTML = `
                        <img src="${member.img}" alt="${member.name}" loading="lazy">
                        <div class="article-card-content">
                            <h3>${member.name}</h3>
                            <p>${member.role}</p>
                            ${member.cat === 'gv' ? '<span class="tag-role" style="background:#FFEbee; color:#ff4757;">Giáo Viên</span>' : ''}
                            ${member.cat === 'bcs' ? '<span class="tag-role">Ban Cán Sự</span>' : ''}
                            ${member.cat === 'media' ? '<span class="tag-role" style="background:#e8f5e9; color:#00b0ff;">Team Media</span>' : ''}
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });
            }
        }

        // Lọc thành viên theo thẻ (chip)
        function filterMembers(category, element) {
            // Đổi màu nút active
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            currentFilter = category;
            
            // Xóa chữ ở ô tìm kiếm
            document.getElementById('search-input').value = '';

            let filteredData = membersData;
            if (category !== 'all') {
                filteredData = membersData.filter(m => m.cat === category);
            }
            renderMembers(filteredData);
        }

        // Tìm kiếm theo tên
        function searchMembers() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            
            let resultData = membersData;
            // Áp dụng filter hiện tại trước
            if (currentFilter !== 'all') {
                resultData = resultData.filter(m => m.cat === currentFilter);
            }
            // Rồi mới tìm kiếm text
            if (query !== '') {
                resultData = resultData.filter(m => m.name.toLowerCase().includes(query) || m.role.toLowerCase().includes(query));
            }
            renderMembers(resultData);
        }

        // Render lần đầu khi vào trang
        renderMembers(membersData);

        // === PROFILE MODAL LOGIC ===
        const profileModal = document.getElementById('profile-modal');
        
        function openProfile(id) {
            const member = membersData.find(m => m.id === id);
            if(member) {
                document.getElementById('pro-img').src = member.img;
                document.getElementById('pro-name').innerText = member.name;
                document.getElementById('pro-role').innerText = member.role;
                document.getElementById('pro-quote').innerText = member.quote;
                
                profileModal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Khóa cuộn trang
            }
        }

        function closeProfile() {
            profileModal.classList.remove('active');
            document.body.style.overflow = 'auto'; // Mở cuộn trang
        }

        function closeProfileOutside(event) {
            if(event.target.id === 'profile-modal') {
                closeProfile();
            }
        }
    </script>
</body>
</html>
